services:
  ev-store:
    build:
      context: .
      dockerfile: Dockerfile
    image: ev-store:local
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      SPRING_DATASOURCE_URL: "jdbc:h2:file:/data/evstoredb"
      SPRING_DATASOURCE_USERNAME: "sa"
      SPRING_DATASOURCE_PASSWORD: ""
      SPRING_JPA_SHOW_SQL: "false"
      H2_CONSOLE_ENABLED: "false"
    volumes:
      - ev-store-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  ev-store-data:
